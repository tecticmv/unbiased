name = "unbiased"
compatibility_date = "2024-09-23"
main = "functions/worker.ts"

# Static assets (replaces pages_build_output_dir)
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "unbiased-db"
database_id = "99f60302-8489-4441-b602-38efc950ae77"

[vars]
APP_NAME = "Unbiased"
GEMINI_MODEL = "gemini-2.5-flash"

# Add secrets via wrangler secret put <SECRET_NAME>
# Required:
#   GEMINI_API_KEY - Google Gemini API key for analysis
#
# For country automation (optional):
#   GITHUB_TOKEN - GitHub token with repo access for workflow dispatch
#   GITHUB_REPO - Repository in format "owner/repo"
#   TELEGRAM_BOT_TOKEN - Telegram bot token for notifications
#   TELEGRAM_OWNER_CHAT_ID - Chat ID to send approval requests to

# Durable Objects for WebSocket support
[durable_objects]
bindings = [
  { name = "DISCUSSION_ROOM", class_name = "DiscussionRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DiscussionRoom"]
