name = "unbiased"
compatibility_date = "2024-09-23"
main = "functions/worker.ts"

# Static assets (replaces pages_build_output_dir)
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "unbiased-db"
database_id = "local-dev-db"

[vars]
APP_NAME = "Unbiased"
GEMINI_MODEL = "gemini-2.5-flash"

# Add GEMINI_API_KEY via wrangler secret put GEMINI_API_KEY

# Durable Objects for WebSocket support
[durable_objects]
bindings = [
  { name = "DISCUSSION_ROOM", class_name = "DiscussionRoom" }
]

[[migrations]]
tag = "v1"
new_classes = ["DiscussionRoom"]
