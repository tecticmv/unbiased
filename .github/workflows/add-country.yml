name: Add Country Automation (DISABLED - Manual Process)

# WORKFLOW DISABLED: Country additions are now handled manually
# The API validates country data and sends notifications to Telegram
# Owner manually adds the country and clicks "Done" button when deployed

on:
  workflow_dispatch:
    inputs:
      country_name:
        description: 'Name of the country to add'
        required: true
        type: string
      request_id:
        description: 'Database request ID for status updates'
        required: true
        type: string
      validated_data:
        description: 'Pre-validated country data from API (JSON)'
        required: false
        type: string
      fix_feedback:
        description: 'Feedback from owner about what to fix (optional)'
        required: false
        type: string

env:
  WORKER_URL: ${{ secrets.WORKER_URL }}

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-and-review:
    if: false  # DISABLED - Manual process only
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.branch.outputs.branch_name }}
      pr_number: ${{ steps.create_pr.outputs.pr_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if country already exists
        run: |
          COUNTRY_NAME="${{ inputs.country_name }}"
          COUNTRY_LOWER=$(echo "$COUNTRY_NAME" | tr '[:upper:]' '[:lower:]')

          # Safety check: ensure country doesn't already exist in codebase
          if grep -qi "\"$COUNTRY_LOWER\":" src/lib/countries.ts || grep -qi "'$COUNTRY_LOWER':" src/lib/countries.ts; then
            echo "Country '$COUNTRY_NAME' already exists in codebase"
            curl -X POST "${{ env.WORKER_URL }}/api/country-request/webhook/github" \
              -H "Content-Type: application/json" \
              -d "{\"requestId\": ${{ inputs.request_id }}, \"status\": \"failed\", \"error\": \"Country already exists in the platform\"}"
            exit 1
          fi

          echo "Country not found in codebase, proceeding with generation"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Create branch
        id: branch
        run: |
          # Get slug from validated data or generate from country name
          if [ -n "${{ inputs.validated_data }}" ]; then
            SLUG=$(echo '${{ inputs.validated_data }}' | jq -r '.slug // empty')
          fi
          if [ -z "$SLUG" ]; then
            SLUG=$(echo "${{ inputs.country_name }}" | tr '[:upper:]' '[:lower:]' | tr ' ' '-')
          fi

          BRANCH_NAME="feat/add-country-${SLUG}"
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin
          if git show-ref --verify --quiet refs/remotes/origin/${BRANCH_NAME}; then
            git push origin --delete ${BRANCH_NAME} || true
          fi

          git checkout -b "${BRANCH_NAME}"

      - name: Generate and review code
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VALIDATED_DATA: ${{ inputs.validated_data }}
          FIX_FEEDBACK: ${{ inputs.fix_feedback }}
        run: |-
          ATTEMPT=0
          MAX_ATTEMPTS=3
          SUCCESS=false

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ] && [ "$SUCCESS" != "true" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "=== Attempt $ATTEMPT of $MAX_ATTEMPTS ==="

            PREV_ERRORS=""
            if [ -f /tmp/build_errors.txt ]; then
              PREV_ERRORS=$(cat /tmp/build_errors.txt)
            fi

            # ===== Generate TypeScript file updates =====
            echo "Generating TypeScript files..."
            COUNTRIES_TS=$(cat src/lib/countries.ts)
            CONSTANTS_TS=$(cat functions/api/lib/constants.ts)
            TYPES_TS=$(cat src/types/index.ts)
            PERSONAS_TS=$(cat functions/api/experts/personas.ts)

            PROMPT_TS="You are a senior TypeScript developer. Add a new country to the codebase by updating 4 TypeScript files.

            VALIDATED COUNTRY DATA:
            $VALIDATED_DATA

            CRITICAL INSTRUCTIONS:
            1. Return COMPLETE files (not snippets or diffs)
            2. Preserve ALL existing countries and their data EXACTLY as-is
            3. Add the new country following the EXACT patterns and conventions of existing entries
            4. Use proper TypeScript syntax with correct types
            5. Maintain alphabetical ordering where applicable
            6. Use lowercase slug format (e.g., 'srilanka' not 'sri-lanka' or 'Sri Lanka')
            7. Generate realistic, culturally appropriate expert names for the country
            8. Ensure all arrays end with commas, all objects follow existing formatting
            9. Do NOT modify imports, exports, or type definitions
            10. Match indentation and code style exactly

            FILE 1: src/lib/countries.ts
            - Add new entry to 'countries' object
            - Use validated data for: slug, code, name, currency, currencySymbol, flag
            - Generate comprehensive regions list (major cities, provinces, states, or districts)
            - Include diverse projectTypes covering all sectors
            - Write informative description about the country
            - PRESERVE all existing entries unchanged

            FILE 2: functions/api/lib/constants.ts
            - Add currency mapping to 'countryCurrencies' object
            - Add country to 'supportedCountries' array with: code, name, flag, currency
            - Do NOT modify languageNames or other constants
            - PRESERVE all existing entries unchanged

            FILE 3: src/types/index.ts
            - NO CHANGES unless new types are required
            - Return the file exactly as-is
            - This file contains shared type definitions that should not change

            FILE 4: functions/api/experts/personas.ts
            - Add expert names for the new country to 'expertNamesByRegion' object
            - Generate 7 culturally appropriate names (one per expert role):
              * ai_economist (Dr. title preferred)
              * ai_engineer
              * ai_legal
              * ai_environmental (Dr. title preferred)
              * ai_social
              * ai_operations
              * ai_moderator
            - Use authentic names from that country's naming conventions
            - Mix genders appropriately for the region
            - Do NOT modify 'baseExpertPersonas' object
            - PRESERVE all existing entries unchanged"
            if [ -n "$FIX_FEEDBACK" ]; then
              PROMPT_TS="$PROMPT_TS

            OWNER FEEDBACK TO ADDRESS:
            $FIX_FEEDBACK"
            fi
            if [ -n "$PREV_ERRORS" ]; then
              PROMPT_TS="$PROMPT_TS

            FIX THESE BUILD ERRORS:
            $PREV_ERRORS"
            fi
            PROMPT_TS="$PROMPT_TS

            CURRENT FILE CONTENTS:

            === src/lib/countries.ts ===
            $COUNTRIES_TS

            === functions/api/lib/constants.ts ===
            $CONSTANTS_TS

            === src/types/index.ts ===
            $TYPES_TS

            === functions/api/experts/personas.ts ===
            $PERSONAS_TS

            Return valid JSON with this exact structure:
            {
              \"countries_ts\": \"<complete file content>\",
              \"constants_ts\": \"<complete file content>\",
              \"types_ts\": \"<complete file content>\",
              \"personas_ts\": \"<complete file content>\"
            }"

            echo "$PROMPT_TS" > /tmp/prompt_ts.txt
            jq -n --rawfile prompt /tmp/prompt_ts.txt \
              '{contents: [{parts: [{text: $prompt}]}], generationConfig: {maxOutputTokens: 32768, responseMimeType: "application/json"}}' \
              > /tmp/payload_ts.json

            RESPONSE_TS=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \
              -H "Content-Type: application/json" -d @/tmp/payload_ts.json)

            if [ -n "$(echo "$RESPONSE_TS" | jq -r '.error.message // empty')" ]; then
              echo "Gemini error: $(echo "$RESPONSE_TS" | jq -r '.error.message')"
              echo "$RESPONSE_TS" > /tmp/build_errors.txt
              continue
            fi

            GEN_TS=$(echo "$RESPONSE_TS" | jq -r '.candidates[0].content.parts[0].text // empty')
            if [ -z "$GEN_TS" ] || ! echo "$GEN_TS" | jq -e . >/dev/null 2>&1; then
              echo "Invalid TS response"
              echo "$GEN_TS" > /tmp/build_errors.txt
              continue
            fi

            echo "$GEN_TS" | jq -r '.countries_ts' > src/lib/countries.ts
            echo "$GEN_TS" | jq -r '.constants_ts' > functions/api/lib/constants.ts
            echo "$GEN_TS" | jq -r '.types_ts' > src/types/index.ts
            echo "$GEN_TS" | jq -r '.personas_ts' > functions/api/experts/personas.ts

            # ===== Generate locale translations (snippets only) =====
            echo "Generating locale translations..."

            PROMPT_LOCALE="Generate accurate translations of the country name for 6 locales.

            COUNTRY DATA: $VALIDATED_DATA

            REQUIREMENTS:
            1. Use the lowercase slug format from the validated data
            2. Provide native, culturally accurate translations (not transliterations)
            3. Use official country names in each language
            4. Ensure correct script/alphabet for each language:
               - dv: Dhivehi (Thaana script)
               - hi: Hindi (Devanagari script)
               - bn: Bengali (Bengali script)
               - si: Sinhala (Sinhala script)
               - ta: Tamil (Tamil script)
            5. For English, use the official short name

            EXAMPLES:
            - India → dv: \"އިންޑިޔާ\", hi: \"भारत\", bn: \"ভারত\", si: \"ඉන්දියාව\", ta: \"இந்தியா\"
            - Sri Lanka → dv: \"ސްރީލަންކާ\", hi: \"श्रीलंका\", bn: \"শ্রীলঙ্কা\", si: \"ශ්‍රී ලංකාව\", ta: \"இலங்கை\"

            Return JSON with this exact structure:
            {
              \"slug\": \"countryslug\",
              \"translations\": {
                \"en\": \"Country Name\",
                \"dv\": \"ދިވެހި\",
                \"hi\": \"हिन्दी\",
                \"bn\": \"বাংলা\",
                \"si\": \"සිංහල\",
                \"ta\": \"தமிழ்\"
              }
            }"

            echo "$PROMPT_LOCALE" > /tmp/prompt_locale.txt
            jq -n --rawfile prompt /tmp/prompt_locale.txt \
              '{contents: [{parts: [{text: $prompt}]}], generationConfig: {maxOutputTokens: 1024, responseMimeType: "application/json"}}' \
              > /tmp/payload_locale.json

            RESPONSE_LOCALE=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \
              -H "Content-Type: application/json" -d @/tmp/payload_locale.json)

            if [ -n "$(echo "$RESPONSE_LOCALE" | jq -r '.error.message // empty')" ]; then
              echo "Gemini error: $(echo "$RESPONSE_LOCALE" | jq -r '.error.message')"
              echo "$RESPONSE_LOCALE" > /tmp/build_errors.txt
              continue
            fi

            GEN_LOCALE=$(echo "$RESPONSE_LOCALE" | jq -r '.candidates[0].content.parts[0].text // empty')
            if [ -z "$GEN_LOCALE" ] || ! echo "$GEN_LOCALE" | jq -e . >/dev/null 2>&1; then
              echo "Invalid locale response"
              echo "$GEN_LOCALE" > /tmp/build_errors.txt
              continue
            fi

            SLUG=$(echo "$GEN_LOCALE" | jq -r '.slug')

            # Merge translations into locale files using jq
            for LOCALE in en dv hi bn si ta; do
              TRANSLATION=$(echo "$GEN_LOCALE" | jq -r ".translations.${LOCALE}")
              jq ".countries.\"$SLUG\" = \"$TRANSLATION\"" "src/locales/${LOCALE}.json" > "/tmp/${LOCALE}.json"
              mv "/tmp/${LOCALE}.json" "src/locales/${LOCALE}.json"
            done

            # Verify
            echo "Running TypeScript check..."
            if ! pnpm tsc --noEmit 2> /tmp/tsc_errors.txt; then
              cat /tmp/tsc_errors.txt > /tmp/build_errors.txt
              continue
            fi

            echo "Running build..."
            if ! pnpm build 2> /tmp/build_errors.txt; then
              continue
            fi

            # Validate all files contain the new country
            ERRORS=""
            grep -q "$SLUG" src/lib/countries.ts || ERRORS="$ERRORS\n- Missing in countries.ts"
            grep -q "$SLUG" functions/api/lib/constants.ts || ERRORS="$ERRORS\n- Missing in constants.ts"
            grep -q "$SLUG" src/types/index.ts || ERRORS="$ERRORS\n- Missing in types/index.ts"
            grep -q "$SLUG" functions/api/experts/personas.ts || ERRORS="$ERRORS\n- Missing in personas.ts"

            for L in en dv hi bn si ta; do
              grep -q "\"$SLUG\"" src/locales/${L}.json || ERRORS="$ERRORS\n- Missing in ${L}.json"
            done

            if [ -n "$ERRORS" ]; then
              echo -e "$ERRORS" > /tmp/build_errors.txt
              continue
            fi

            SUCCESS=true
          done

          if [ "$SUCCESS" != "true" ]; then
            curl -X POST "${{ env.WORKER_URL }}/api/country-request/webhook/github" \
              -H "Content-Type: application/json" \
              -d "{\"requestId\": ${{ inputs.request_id }}, \"status\": \"failed\", \"error\": \"Generation failed after $MAX_ATTEMPTS attempts\"}"
            exit 1
          fi

      - name: Commit and push
        run: |
          git add -A
          git commit -m "feat: add ${{ inputs.country_name }} country support

          Request ID: ${{ inputs.request_id }}
          Co-Authored-By: Gemini AI <noreply@google.com>"
          git push -u origin ${{ steps.branch.outputs.branch_name }}

      - name: Create Pull Request
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          PR_URL=$(gh pr create \
            --title "feat: Add ${{ inputs.country_name }} country support" \
            --body "## Summary
          Adds **${{ inputs.country_name }}** to the platform.

          ### Files Modified (10+ files)
          - \`src/lib/countries.ts\`
          - \`functions/api/lib/constants.ts\`
          - \`src/types/index.ts\`
          - \`functions/api/experts/personas.ts\`
          - All 6 locale files

          ### Automated Checks
          - [x] TypeScript passed
          - [x] Build passed
          - [x] All files validated

          Request ID: \`${{ inputs.request_id }}\`" \
            --base main)

          PR_NUMBER=$(echo "$PR_URL" | grep -oP '/pull/\K[0-9]+')
          echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT

  notify-ready:
    needs: generate-and-review
    runs-on: ubuntu-latest

    steps:
      - name: Notify PR ready for review
        run: |
          PR_URL="https://github.com/${{ github.repository }}/pull/${{ needs.generate-and-review.outputs.pr_number }}"

          echo "PR created: $PR_URL"

          curl -X POST "${{ env.WORKER_URL }}/api/country-request/webhook/github" \
            -H "Content-Type: application/json" \
            -d "{
              \"requestId\": ${{ inputs.request_id }},
              \"status\": \"pending_review\",
              \"prUrl\": \"$PR_URL\",
              \"branchName\": \"${{ needs.generate-and-review.outputs.branch_name }}\",
              \"prNumber\": ${{ needs.generate-and-review.outputs.pr_number }}
            }"

      - name: Handle failure
        if: failure()
        run: |
          curl -X POST "${{ env.WORKER_URL }}/api/country-request/webhook/github" \
            -H "Content-Type: application/json" \
            -d '{"requestId": ${{ inputs.request_id }}, "status": "failed", "error": "Webhook notification failed"}'
