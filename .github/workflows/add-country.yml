name: Add Country Automation

on:
  workflow_dispatch:
    inputs:
      country_name:
        description: 'Name of the country to add'
        required: true
        type: string
      request_id:
        description: 'Database request ID for status updates'
        required: true
        type: string
      validated_data:
        description: 'Pre-validated country data from API (JSON)'
        required: false
        type: string
      fix_feedback:
        description: 'Feedback from owner about what to fix (optional)'
        required: false
        type: string

env:
  WORKER_URL: ${{ secrets.WORKER_URL }}

jobs:
  generate-and-review:
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.branch.outputs.branch_name }}
      pr_number: ${{ steps.create_pr.outputs.pr_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if country already exists
        run: |
          COUNTRY_NAME="${{ inputs.country_name }}"
          COUNTRY_LOWER=$(echo "$COUNTRY_NAME" | tr '[:upper:]' '[:lower:]')

          # Safety check: ensure country doesn't already exist in codebase
          if grep -qi "\"$COUNTRY_LOWER\":" src/lib/countries.ts || grep -qi "'$COUNTRY_LOWER':" src/lib/countries.ts; then
            echo "Country '$COUNTRY_NAME' already exists in codebase"
            curl -X POST "${{ env.WORKER_URL }}/api/country-request/webhook/github" \
              -H "Content-Type: application/json" \
              -d "{\"requestId\": ${{ inputs.request_id }}, \"status\": \"failed\", \"error\": \"Country already exists in the platform\"}"
            exit 1
          fi

          echo "Country not found in codebase, proceeding with generation"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Create branch
        id: branch
        run: |
          # Get slug from validated data or generate from country name
          if [ -n "${{ inputs.validated_data }}" ]; then
            SLUG=$(echo '${{ inputs.validated_data }}' | jq -r '.slug // empty')
          fi
          if [ -z "$SLUG" ]; then
            SLUG=$(echo "${{ inputs.country_name }}" | tr '[:upper:]' '[:lower:]' | tr ' ' '-')
          fi

          BRANCH_NAME="feat/add-country-${SLUG}"
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin
          if git show-ref --verify --quiet refs/remotes/origin/${BRANCH_NAME}; then
            git push origin --delete ${BRANCH_NAME} || true
          fi

          git checkout -b "${BRANCH_NAME}"

      - name: Generate and review code
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VALIDATED_DATA: ${{ inputs.validated_data }}
          FIX_FEEDBACK: ${{ inputs.fix_feedback }}
        run: |-
          ATTEMPT=0
          MAX_ATTEMPTS=3
          SUCCESS=false

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ] && [ "$SUCCESS" != "true" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "=== Attempt $ATTEMPT of $MAX_ATTEMPTS ==="

            PREV_ERRORS=""
            if [ -f /tmp/build_errors.txt ]; then
              PREV_ERRORS=$(cat /tmp/build_errors.txt)
            fi

            # ===== STEP 1: Generate TypeScript files =====
            echo "Step 1: Generating TypeScript files..."
            COUNTRIES_TS=$(cat src/lib/countries.ts)
            CONSTANTS_TS=$(cat functions/api/lib/constants.ts)
            TYPES_TS=$(cat src/types/index.ts)
            PERSONAS_TS=$(cat functions/api/experts/personas.ts)

            PROMPT_TS="Add a new country to this project. Generate COMPLETE updated file contents for TypeScript files.

            VALIDATED COUNTRY DATA - $VALIDATED_DATA"
            if [ -n "$FIX_FEEDBACK" ]; then
              PROMPT_TS="$PROMPT_TS

            OWNER FEEDBACK - $FIX_FEEDBACK"
            fi
            if [ -n "$PREV_ERRORS" ]; then
              PROMPT_TS="$PROMPT_TS

            ERRORS TO FIX - $PREV_ERRORS"
            fi
            PROMPT_TS="$PROMPT_TS

            FILES TO MODIFY

            FILE src/lib/countries.ts
            $COUNTRIES_TS

            FILE functions/api/lib/constants.ts
            $CONSTANTS_TS

            FILE src/types/index.ts
            $TYPES_TS

            FILE functions/api/experts/personas.ts
            $PERSONAS_TS

            REQUIREMENTS
            1. countries.ts - Add country to 'countries' object
            2. constants.ts - Add to 'countryCurrencies' AND 'supportedCountries'
            3. types/index.ts - Add expert names to 'expertNamesByRegion' BEFORE 'default'
            4. personas.ts - Add IDENTICAL expert names to 'expertNamesByRegion' BEFORE 'default'

            Return JSON: {countries_ts: complete file, constants_ts: complete file, types_ts: complete file, personas_ts: complete file}
            Return ONLY valid JSON."

            echo "$PROMPT_TS" > /tmp/prompt_ts.txt

            jq -n --rawfile prompt /tmp/prompt_ts.txt \
              '{contents: [{parts: [{text: $prompt}]}], generationConfig: {temperature: 0.2, maxOutputTokens: 32768, responseMimeType: "application/json"}}' \
              > /tmp/payload_ts.json

            RESPONSE_TS=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \
              -H "Content-Type: application/json" -d @/tmp/payload_ts.json)

            ERROR_MSG=$(echo "$RESPONSE_TS" | jq -r '.error.message // empty')
            if [ -n "$ERROR_MSG" ]; then
              echo "Gemini API error (TS): $ERROR_MSG"
              echo "$ERROR_MSG" > /tmp/build_errors.txt
              continue
            fi

            GENERATED_TS=$(echo "$RESPONSE_TS" | jq -r '.candidates[0].content.parts[0].text // empty')
            if [ -z "$GENERATED_TS" ] || [ "$GENERATED_TS" = "null" ]; then
              echo "Empty response from Gemini (TS)"
              echo "$RESPONSE_TS" > /tmp/build_errors.txt
              continue
            fi

            if ! echo "$GENERATED_TS" | jq -e . > /dev/null 2>&1; then
              echo "Invalid JSON from Gemini (TS)"
              echo "$GENERATED_TS" > /tmp/build_errors.txt
              continue
            fi

            echo "$GENERATED_TS" | jq -r '.countries_ts' > src/lib/countries.ts
            echo "$GENERATED_TS" | jq -r '.constants_ts' > functions/api/lib/constants.ts
            echo "$GENERATED_TS" | jq -r '.types_ts' > src/types/index.ts
            echo "$GENERATED_TS" | jq -r '.personas_ts' > functions/api/experts/personas.ts

            # ===== STEP 2: Generate first batch of locale files =====
            echo "Step 2: Generating locale files (en, dv, hi)..."
            EN_JSON=$(cat src/locales/en.json)
            DV_JSON=$(cat src/locales/dv.json)
            HI_JSON=$(cat src/locales/hi.json)

            PROMPT_LOCALE1="Add country translations to locale files. Generate COMPLETE updated file contents.

            VALIDATED COUNTRY DATA - $VALIDATED_DATA

            FILES TO MODIFY

            FILE src/locales/en.json
            $EN_JSON

            FILE src/locales/dv.json
            $DV_JSON

            FILE src/locales/hi.json
            $HI_JSON

            REQUIREMENT - Add country name to 'countries' section using translations from validated data

            Return JSON: {en_json: complete file, dv_json: complete file, hi_json: complete file}
            Return ONLY valid JSON."

            echo "$PROMPT_LOCALE1" > /tmp/prompt_locale1.txt

            jq -n --rawfile prompt /tmp/prompt_locale1.txt \
              '{contents: [{parts: [{text: $prompt}]}], generationConfig: {temperature: 0.2, maxOutputTokens: 32768, responseMimeType: "application/json"}}' \
              > /tmp/payload_locale1.json

            RESPONSE_LOCALE1=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \
              -H "Content-Type: application/json" -d @/tmp/payload_locale1.json)

            ERROR_MSG=$(echo "$RESPONSE_LOCALE1" | jq -r '.error.message // empty')
            if [ -n "$ERROR_MSG" ]; then
              echo "Gemini API error (Locale 1): $ERROR_MSG"
              echo "$ERROR_MSG" > /tmp/build_errors.txt
              continue
            fi

            GENERATED_LOCALE1=$(echo "$RESPONSE_LOCALE1" | jq -r '.candidates[0].content.parts[0].text // empty')
            if [ -z "$GENERATED_LOCALE1" ] || [ "$GENERATED_LOCALE1" = "null" ]; then
              echo "Empty response from Gemini (Locale 1)"
              echo "$RESPONSE_LOCALE1" > /tmp/build_errors.txt
              continue
            fi

            if ! echo "$GENERATED_LOCALE1" | jq -e . > /dev/null 2>&1; then
              echo "Invalid JSON from Gemini (Locale 1)"
              echo "$GENERATED_LOCALE1" > /tmp/build_errors.txt
              continue
            fi

            echo "$GENERATED_LOCALE1" | jq -r '.en_json' > src/locales/en.json
            echo "$GENERATED_LOCALE1" | jq -r '.dv_json' > src/locales/dv.json
            echo "$GENERATED_LOCALE1" | jq -r '.hi_json' > src/locales/hi.json

            # ===== STEP 3: Generate second batch of locale files =====
            echo "Step 3: Generating locale files (bn, si, ta)..."
            BN_JSON=$(cat src/locales/bn.json)
            SI_JSON=$(cat src/locales/si.json)
            TA_JSON=$(cat src/locales/ta.json)

            PROMPT_LOCALE2="Add country translations to locale files. Generate COMPLETE updated file contents.

            VALIDATED COUNTRY DATA - $VALIDATED_DATA

            FILES TO MODIFY

            FILE src/locales/bn.json
            $BN_JSON

            FILE src/locales/si.json
            $SI_JSON

            FILE src/locales/ta.json
            $TA_JSON

            REQUIREMENT - Add country name to 'countries' section using translations from validated data

            Return JSON: {bn_json: complete file, si_json: complete file, ta_json: complete file}
            Return ONLY valid JSON."

            echo "$PROMPT_LOCALE2" > /tmp/prompt_locale2.txt

            jq -n --rawfile prompt /tmp/prompt_locale2.txt \
              '{contents: [{parts: [{text: $prompt}]}], generationConfig: {temperature: 0.2, maxOutputTokens: 32768, responseMimeType: "application/json"}}' \
              > /tmp/payload_locale2.json

            RESPONSE_LOCALE2=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \
              -H "Content-Type: application/json" -d @/tmp/payload_locale2.json)

            ERROR_MSG=$(echo "$RESPONSE_LOCALE2" | jq -r '.error.message // empty')
            if [ -n "$ERROR_MSG" ]; then
              echo "Gemini API error (Locale 2): $ERROR_MSG"
              echo "$ERROR_MSG" > /tmp/build_errors.txt
              continue
            fi

            GENERATED_LOCALE2=$(echo "$RESPONSE_LOCALE2" | jq -r '.candidates[0].content.parts[0].text // empty')
            if [ -z "$GENERATED_LOCALE2" ] || [ "$GENERATED_LOCALE2" = "null" ]; then
              echo "Empty response from Gemini (Locale 2)"
              echo "$RESPONSE_LOCALE2" > /tmp/build_errors.txt
              continue
            fi

            if ! echo "$GENERATED_LOCALE2" | jq -e . > /dev/null 2>&1; then
              echo "Invalid JSON from Gemini (Locale 2)"
              echo "$GENERATED_LOCALE2" > /tmp/build_errors.txt
              continue
            fi

            echo "$GENERATED_LOCALE2" | jq -r '.bn_json' > src/locales/bn.json
            echo "$GENERATED_LOCALE2" | jq -r '.si_json' > src/locales/si.json
            echo "$GENERATED_LOCALE2" | jq -r '.ta_json' > src/locales/ta.json

            # Verify
            echo "Running TypeScript check..."
            if ! pnpm tsc --noEmit 2> /tmp/tsc_errors.txt; then
              cat /tmp/tsc_errors.txt > /tmp/build_errors.txt
              continue
            fi

            echo "Running build..."
            if ! pnpm build 2> /tmp/build_errors.txt; then
              continue
            fi

            SLUG=$(echo "$VALIDATED_DATA" | jq -r '.slug')
            ERRORS=""

            # Validate all files
            grep -q "$SLUG" src/lib/countries.ts || ERRORS="$ERRORS\n- Missing in countries.ts"
            grep -q "$SLUG" functions/api/lib/constants.ts || ERRORS="$ERRORS\n- Missing in constants.ts"
            grep -q "$SLUG" src/types/index.ts || ERRORS="$ERRORS\n- Missing in types/index.ts"
            grep -q "$SLUG" functions/api/experts/personas.ts || ERRORS="$ERRORS\n- Missing in personas.ts"

            for L in en dv hi bn si ta; do
              grep -q "\"$SLUG\"" src/locales/${L}.json || ERRORS="$ERRORS\n- Missing in ${L}.json"
            done

            if [ -n "$ERRORS" ]; then
              echo -e "$ERRORS" > /tmp/build_errors.txt
              continue
            fi

            SUCCESS=true
          done

          if [ "$SUCCESS" != "true" ]; then
            curl -X POST "${{ env.WORKER_URL }}/api/country-request/webhook/github" \
              -H "Content-Type: application/json" \
              -d "{\"requestId\": ${{ inputs.request_id }}, \"status\": \"failed\", \"error\": \"Generation failed after $MAX_ATTEMPTS attempts\"}"
            exit 1
          fi

      - name: Commit and push
        run: |
          git add -A
          git commit -m "feat: add ${{ inputs.country_name }} country support

          Request ID: ${{ inputs.request_id }}
          Co-Authored-By: Gemini AI <noreply@google.com>"
          git push -u origin ${{ steps.branch.outputs.branch_name }}

      - name: Create Pull Request
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --title "feat: Add ${{ inputs.country_name }} country support" \
            --body "## Summary
          Adds **${{ inputs.country_name }}** to the platform.

          ### Files Modified (10+ files)
          - \`src/lib/countries.ts\`
          - \`functions/api/lib/constants.ts\`
          - \`src/types/index.ts\`
          - \`functions/api/experts/personas.ts\`
          - All 6 locale files

          ### Automated Checks
          - [x] TypeScript passed
          - [x] Build passed
          - [x] All files validated

          Request ID: \`${{ inputs.request_id }}\`" \
            --base main)

          PR_NUMBER=$(echo "$PR_URL" | grep -oP '/pull/\K[0-9]+')
          echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT

  deploy-preview:
    needs: generate-and-review
    runs-on: ubuntu-latest

    steps:
      - name: Wait for deployment
        id: wait_deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ needs.generate-and-review.outputs.branch_name }}"
          sleep 30

          for i in $(seq 1 30); do
            DEPLOY_ID=$(gh api repos/${{ github.repository }}/deployments --jq ".[] | select(.ref == \"${BRANCH}\") | .id" 2>/dev/null | head -1)
            if [ -n "$DEPLOY_ID" ]; then
              STATUS=$(gh api repos/${{ github.repository }}/deployments/${DEPLOY_ID}/statuses --jq '.[0].state' 2>/dev/null)
              if [ "$STATUS" == "success" ]; then
                PREVIEW_URL=$(gh api repos/${{ github.repository }}/deployments/${DEPLOY_ID}/statuses --jq '.[0].environment_url' 2>/dev/null)
                break
              fi
            fi
            sleep 20
          done

          [ -z "$PREVIEW_URL" ] && PREVIEW_URL="https://${BRANCH/\//-}.unbiased.pages.dev"
          echo "preview_url=${PREVIEW_URL}" >> $GITHUB_OUTPUT

      - name: Update status
        run: |
          curl -X POST "${{ env.WORKER_URL }}/api/country-request/webhook/github" \
            -H "Content-Type: application/json" \
            -d '{
              "requestId": ${{ inputs.request_id }},
              "status": "preview",
              "previewUrl": "${{ steps.wait_deploy.outputs.preview_url }}",
              "branchName": "${{ needs.generate-and-review.outputs.branch_name }}",
              "prNumber": ${{ needs.generate-and-review.outputs.pr_number }}
            }'

      - name: Handle failure
        if: failure()
        run: |
          curl -X POST "${{ env.WORKER_URL }}/api/country-request/webhook/github" \
            -H "Content-Type: application/json" \
            -d '{"requestId": ${{ inputs.request_id }}, "status": "failed", "error": "Deployment failed"}'
